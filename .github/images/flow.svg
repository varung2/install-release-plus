<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Install Release Plus workflow</title>
  <desc id="desc">Run irp get with a repository URL, choose a release asset, then confirm installation or keep the archive as a tracked download.</desc>
  <rect width="1000" height="280" rx="16" fill="#111827"/>
  <g fill="none" stroke="#60a5fa" stroke-width="2">
    <rect x="20" y="95" width="290" height="80" rx="12"/>
    <path d="M310 135H365m-10-8 10 8-10 8"/>
    <rect x="365" y="95" width="240" height="80" rx="12"/>
    <path d="M605 135H650V65H680m-10-8 10 8-10 8M650 135V215H680m-10-8 10 8-10 8"/>
    <rect x="680" y="25" width="300" height="80" rx="12"/>
    <rect x="680" y="175" width="300" height="80" rx="12"/>
  </g>
  <g fill="#f9fafb" font-family="system-ui, sans-serif" font-size="21" text-anchor="middle">
    <text x="165" y="143" font-family="monospace">irp get &lt;repo-url&gt;</text>
    <text x="485" y="143">Choose release asset</text>
    <text x="830" y="61">Confirm and install</text>
    <text x="830" y="87" font-size="17">its executable</text>
    <text x="830" y="211">Confirm and keep</text>
    <text x="830" y="237" font-size="17">archive as a tracked download</text>
  </g>
</svg>
